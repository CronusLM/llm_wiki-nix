name: Build llm-wiki (Linux)

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  nix-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    # F1 修复：secrets 上下文不可用于 step 级 `if`（官方 Context availability 表：
    # jobs.<job_id>.steps.if 上下文不含 secrets）。改为 job 级 env 注入布尔判定
    # （jobs.<job_id>.env 允许 secrets），step `if` 引用 env（steps.if 允许 env）。
    env:
      HAS_CACHIX: ${{ secrets.CACHIX_AUTH_TOKEN != '' && secrets.CACHIX_REPO != '' }}

    steps:
      # ──────────────────────────────────────────────
      # 1. 代码检出
      # ──────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ──────────────────────────────────────────────
      # 2. 安装 Nix（启用 flakes 与 nix-command）
      # ──────────────────────────────────────────────

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v15
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # ──────────────────────────────────────────────
      # 3. Cachix 二进制缓存（可选；未配置 secrets 时跳过，不影响 CI）
      # ──────────────────────────────────────────────

      - name: Setup Cachix
        if: ${{ env.HAS_CACHIX == 'true' }}
        uses: cachix/cachix-action@v14
        with:
          name: ${{ secrets.CACHIX_REPO }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # ──────────────────────────────────────────────
      # 4. Nix flake check（验证 flake 表达式与 checks）
      # ──────────────────────────────────────────────

      - name: Nix flake check
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix.sh
          nix flake check

      # ──────────────────────────────────────────────
      # 5. Nix build（wrapped 桌面产物 + 原始 AppImage）
      # ──────────────────────────────────────────────

      - name: Nix build llm-wiki and raw AppImage
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix.sh
          nix build .#llm-wiki .#llm-wiki.rawAppImage --print-out-paths

      # ──────────────────────────────────────────────
      # 6. 取件并暂存 AppImage（store 文件 → dist/，剥掉 store hash 前缀作资产名）
      # ──────────────────────────────────────────────

      - name: Stage AppImage
        id: appimage
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix.sh
          raw_appimage="$(nix build .#llm-wiki.rawAppImage --print-out-paths --no-link)"
          if [ ! -f "$raw_appimage" ]; then
            echo "rawAppImage is not a regular file: $raw_appimage" >&2
            exit 1
          fi
          raw_name="$(basename "$raw_appimage")"
          filename="${raw_name#*-}"
          mkdir -p dist
          cp "$raw_appimage" "dist/$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────
      # 7. 上传 AppImage 作为 artifact
      # ──────────────────────────────────────────────

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-wiki-appimage
          path: dist/${{ steps.appimage.outputs.filename }}
          retention-days: 30

      # ──────────────────────────────────────────────
      # 8. 仅在打 tag 时创建 Release
      # ──────────────────────────────────────────────

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.appimage.outputs.filename }}
          generate_release_notes: true
