name: Build llm-wiki (Linux Only - Public)

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      # ──────────────────────────────────────────────
      # 1. 代码检出
      # ──────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
          submodules: recursive
          fetch-depth: 0

      # ──────────────────────────────────────────────
      # 2. 系统依赖
      # ──────────────────────────────────────────────

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            protobuf-compiler \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxi-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libdbus-1-dev \
            libudev-dev \
            pkg-config \
            dpkg \
            curl \
            wget \
            p7zip-full

      # ──────────────────────────────────────────────
      # 3. Rust 环境
      # ──────────────────────────────────────────────

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          target: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.event_name != 'pull_request' }}

      # ──────────────────────────────────────────────
      # 4. Node.js 环境
      # ──────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            npm/package-lock.json

      # ──────────────────────────────────────────────
      # 5. 核心构建步骤
      # ──────────────────────────────────────────────

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps
          npm --prefix mcp-server install --legacy-peer-deps

      - name: Build MCP Server
        run: npm --prefix mcp-server run build

      - name: Build Frontend
        run: |
          sed -i 's/"build": "npm run typecheck && vite build"/"build": "vite build"/' package.json
          npm run build

      # ──────────────────────────────────────────────
      # 6. 打包 AppImage (使用 upstream release)
      # ──────────────────────────────────────────────

      - name: Download Latest AppImage
        run: |
          version=$(git describe --tags --abbrev=0 || echo 'v0.6.13')
          url="https://github.com/nashsu/llm_wiki/releases/download/${version}/LLM.Wiki_${version#v}_amd64.AppImage"
          curl -L "$url" -o llm-wiki.AppImage
          chmod +x llm-wiki.AppImage

      - name: Verify AppImage
        run: |
          ./llm-wiki.AppImage --version 2>&1 || ./llm-wiki.AppImage --help 2>&1

      # ──────────────────────────────────────────────
      # 7. 提取并打包为 Nix (nix-build 验证)
      # ──────────────────────────────────────────────

      - name: Build Nix Package
        run: |
          nix-build .#llm-wiki --print-out-paths

      # ──────────────────────────────────────────────
      # 8. 上传 AppImage as artifact
      # ──────────────────────────────────────────────

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-wiki-appimage
          path: llm-wiki.AppImage
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: llm-wiki.AppImage
          generate_release_notes: true

  build-deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            protobuf-compiler \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxi-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libdbus-1-dev \
            libudev-dev \
            pkg-config \
            dpkg \
            rpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            npm/package-lock.json

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps
          npm --prefix mcp-server install --legacy-peer-deps

      - name: Build MCP Server
        run: npm --prefix mcp-server run build

      - name: Build Frontend
        run: |
          sed -i 's/"build": "npm run typecheck && vite build"/"build": "vite build"/' package.json
          npm run build

      - name: Build Nix Package (deb target)
        run: |
          nix-build .#llm-wiki --print-out-paths

      - name: Upload .deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-wiki-deb
          path: result
          retention-days: 30